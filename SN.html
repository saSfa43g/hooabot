        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #FFF9E6, #FFFFFF);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        .container {
            background: #1A1A1A;
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(255, 252, 0, 0.15);
            border: 1px solid rgba(255, 252, 0, 0.15);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h2 {
            color: #FFFC00;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 25px;
            text-shadow: 0 0 30px rgba(255, 252, 0, 0.2);
        }

        h2 span {
            animation: pulse 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 10px;
            border: 2px solid rgba(255, 252, 0, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #FFFC00;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(255, 252, 0, 0.1);
        }

        input::placeholder {
            color: #666;
        }

        select option {
            background: #1A1A1A;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FFFC00, #e6e300);
            color: #1A1A1A;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 252, 0, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #FFFC00;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .success-message .check {
            font-size: 60px;
            color: #4CAF50;
            animation: popIn 0.5s ease;
        }

        .success-message h3 {
            color: #4CAF50;
            font-size: 22px;
            margin-top: 10px;
        }

        .success-message p {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #555;
            font-size: 12px;
        }

        .footer a {
            color: #FFFC00;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            h2 {
                font-size: 20px;
            }
            input, select {
                padding: 12px 14px;
                font-size: 14px;
            }
            button {
                font-size: 16px;
                padding: 14px;
            }
        }
    </style>
</head>

                    <option value="20000">20000 متابع - 12$</option>

            <button type="submit" id="submitBtn">🚀 زيادة المتابعين الآن</button>

            <div class="spinner" id="spinner"></div>
        </form>

        <div class="success-message" id="successMessage">
            <div class="check">✅</div>
            <h3>تم استلام طلبك!</h3>
            <p>جاري معالجة طلبك، سيتم إضافة المتابعين قريباً</p>

        </div>
